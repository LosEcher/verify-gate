# miri-pure-core.conf — verify-gate
#
# The pure core is the *judgement*: policy matching (allow/deny lists, scope
# narrowing, secret redaction), manifest parsing/validation, and the silence
# ratchet. None of the three touches a clock, a file, or a socket, which is why
# Miri can prove them.
#
# Excluded by measurement, not by name: `check` spawns processes (idle_secs /
# stalled detection needs a real child) and `ledger` writes the run ledger.
MIRI_FILTERS=(policy:: manifest:: silence::)
MIRI_MIN_PASSED=21
MIRI_TARGET=bins
