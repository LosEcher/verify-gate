[meta]
name = "verify-gate self-bootstrap"

[[check]]
name = "main.rs exists"
type = "file"
path = "src/main.rs"
contains = "verify-gate"

[[check]]
name = "crate named verify-gate"
type = "file"
path = "Cargo.toml"
regex = '(?m)^name[ \t]*=[ \t]*"verify-gate"$'

[[check]]
name = "readme documents exit codes"
type = "file"
path = "README.md"
# 断言锚在**三态语义**上，而不是某一版的措辞：
# 2026-10-08 收紧后 exit 0 的含义是"至少一条真 pass 且无 fail"（不再是
# "all checks passed"，因为全 na 现在是 inconclusive + exit 2）。
contains = "inconclusive"

[[check]]
name = "sample fixture parseable"
type = "json"
path = "test/fixtures/sample.json"
field = "deps.serde.features[0]"
equals = "derive"

[[check]]
name = "policy subcommand self-bootstrap"
type = "cmd"
cmd = "./target/debug/verify-gate policy --manifest policy.toml --context test/fixtures/self-ctx.json --no-log"
exit = 0
