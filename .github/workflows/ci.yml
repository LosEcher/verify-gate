name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Without this every run recompiles the whole graph on all three platforms.
      # Baseline before this commit: ubuntu 49s / macos 93s / windows 99s per job.
      # Keyed on the toolchain plus Cargo.lock, prunes stale artifacts, and keeps the
      # saving on a failing run.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build
      - name: Unit tests
        run: cargo test
      # Full acceptance gates run on unix (gates.sh needs posix tools +
      # python3; Windows runs unit tests only in P0).
      - name: Acceptance gates
        if: runner.os != 'Windows'
        shell: bash
        run: bash test/gates.sh

  # Miri under Tree Borrows, restricted to the syscall-free pure core
  # (`policy` / `manifest` / `silence`). Miri cannot execute FFI or real
  # syscalls, so `check` (spawns children, needs them for idle_secs) and
  # `ledger` (writes) are out of scope by construction. Keep this list in sync
  # with scripts/miri-pure-core.conf; the gate asserts a test floor so a filter
  # that stops matching fails instead of reporting "0 passed, ok".
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri --component rust-src
          cargo +nightly miri --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: miri
          cache-on-failure: true
      - name: Gate self-test (negative controls)
        run: bash scripts/miri-pure-core.sh --self-test
      - name: Miri pure core (Tree Borrows)
        run: bash scripts/miri-pure-core.sh

  # Release assets follow the fixed `verify-gate-<os>-<arch>` naming contract
  # (consumers resolve the right file deterministically; each matrix row
  # builds for an explicit rustc target matching the runner's native arch).
  # Note: no aarch64-unknown-linux-musl row — ureq's TLS (ring) needs a
  # full musl-cross toolchain there; add it (zig cc or musl-cross) when an
  # alpine/arm64 docker consumer appears.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: verify-gate-linux-x86_64
            bin: verify-gate
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: verify-gate-linux-x86_64-musl
            bin: verify-gate
            install-musl: 'true'
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: verify-gate-macos-aarch64
            bin: verify-gate
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: verify-gate-windows-x86_64.exe
            bin: verify-gate.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # `--target <triple>` writes under target/<triple>, so the key must include
          # the triple or the four rows would share a single entry.
          key: ${{ matrix.target }}
      - name: Install musl toolchain (ring C build)
        if: matrix.install-musl == 'true'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build dist binary (${{ matrix.target }})
        # Shipped assets come from the `dist` profile, where the size knobs live.
        # The test matrix above keeps plain `--release` for its compile check, and
        # `--release` is now cargo's default profile, so only this tag-time
        # packaging job pays the fat-LTO wall-clock cost.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --profile dist --target ${{ matrix.target }}
      - name: Stage asset as ${{ matrix.asset }}
        shell: bash
        run: |
          mkdir -p dist
          mv "target/${{ matrix.target }}/dist/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify staged assets
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
