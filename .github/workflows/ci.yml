name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build
      - name: Unit tests
        run: cargo test
      # Full acceptance gates run on unix (gates.sh needs posix tools +
      # python3; Windows runs unit tests only in P0).
      - name: Acceptance gates
        if: runner.os != 'Windows'
        shell: bash
        run: bash test/gates.sh

  # Release assets follow the fixed `verify-gate-<os>-<arch>` naming contract
  # (consumers resolve the right file deterministically; each matrix row
  # builds for an explicit rustc target matching the runner's native arch).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: verify-gate-linux-x86_64
            bin: verify-gate
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: verify-gate-linux-x86_64-musl
            bin: verify-gate
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: verify-gate-linux-aarch64-musl
            bin: verify-gate
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: verify-gate-macos-aarch64
            bin: verify-gate
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: verify-gate-windows-x86_64.exe
            bin: verify-gate.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset as ${{ matrix.asset }}
        shell: bash
        run: |
          mkdir -p dist
          mv "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify staged assets
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
