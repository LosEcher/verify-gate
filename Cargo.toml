[package]
name = "verify-gate"
version = "0.2.0"
edition = "2021"
description = "Declarative verification manifest executor for AI agents: assert file/cmd/http/git/json outcomes, emit a pass/fail report, and return a strict exit code (0 pass / 1 fail / 2 tool error)."
license = "MIT"
repository = "https://github.com/LosEcher/verify-gate"
keywords = ["verify", "assert", "agent", "gate", "check"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = "2"

[[bin]]
name = "verify-gate"
path = "src/main.rs"

# --- Shipped-artifact size ---------------------------------------------------------------
# Measured, not guessed: this combination is substantially smaller than the default release
# profile, while `opt-level = "z"` on its own is *larger* than the default `opt-level = 3`
# here. Single-knob comparisons mislead; only the measured combination is meaningful.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
# `strip` removes the symbol table (a real size win for the shipped binary) but also makes
# `cargo bloat` / `nm` useless. For size analysis, override it for a single build:
#   cargo build --release --config 'profile.release.strip="none"'
# `panic = "abort"` is deliberately NOT set, for two reasons: it changes crash behaviour
# from unwinding (exit 101) to SIGABRT (exit 134); and this crate implements
# "exit 2 = tool error" with `std::panic::catch_unwind` (src/main.rs), which abort breaks.

# cargo never reclaims `target/*/incremental`, and it ends up dwarfing the working set it
# accelerates. Off here; the cost is a few seconds per crate when recompiling.
[profile.dev]
incremental = false
