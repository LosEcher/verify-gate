[package]
name = "verify-gate"
version = "0.3.0"
edition = "2021"
description = "Declarative verification manifest executor for AI agents: assert file/cmd/http/git/json outcomes, emit a pass/fail report, and return a strict exit code (0 pass / 1 fail / 2 tool error)."
license = "MIT"
repository = "https://github.com/LosEcher/verify-gate"
keywords = ["verify", "assert", "agent", "gate", "check"]
categories = ["development-tools", "command-line-utilities"]

# `cargo package` ships `scripts/` by default, and everything in there is
# fleet-internal: the build-profile writer, the artifact cleaner, and the Miri
# gate (which probes ~/.cargo and a Miri sysroot and asserts this repo's test
# floor — a consumer has no use for any of them). Nothing in scripts/ is
# referenced by the README, so the whole directory goes.
exclude = ["scripts/"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = "2"

[[bin]]
name = "verify-gate"
path = "src/main.rs"

# --- Shipped-artifact size ---------------------------------------------------------------
# Artifact size and build time pull in opposite directions, so they get two profiles
# instead of one compromise that silently pays for both:
#
#   --release  (deliberately left as cargo's default: nothing is overridden)
#       what developers and the pull-request CI matrix build. `codegen-units = 16` keeps
#       intra-crate parallelism and there is no LTO, so it stays fast; `cargo install
#       verify-gate` lands here too, so users get a fast local build.
#
#   --profile dist
#       only used when producing the published release assets. This is where the size
#       knobs live, and only the tag-time packaging job pays for them: measured 1.4x
#       wall-clock here (up to ~2x on the leaner crates in this fleet), worse on a loaded
#       machine, because `codegen-units = 1` removes the parallelism that lets a build
#       absorb contention.
#
# The knobs are NOT in [profile.release]: they made every single `--release` build about
# twice as slow, for bytes that only leave the building from a tagged release.
[profile.release]
# Intentionally empty: cargo's defaults. The size knobs live in [profile.dist] below.

[profile.dist]
inherits = "release" # required: cargo errors out on a custom profile without it
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
# Measured, not guessed: this combination is substantially smaller than the default release
# profile, while `opt-level = "z"` on its own is *larger* than the default `opt-level = 3`
# here. Single-knob comparisons mislead; only the measured combination is meaningful.
# `strip` removes the symbol table (a real size win for the shipped binary) but also makes
# `cargo bloat` / `nm` useless. For size analysis, override it for a single build:
#   cargo build --profile dist --config 'profile.dist.strip="none"'
# `panic = "abort"` is deliberately NOT set, and it can never be added to *any* profile of
# this crate, for two reasons: it changes crash behaviour from unwinding (exit 101) to
# SIGABRT (exit 134); and the crate implements its "exit 2 = tool error" contract with
# `std::panic::catch_unwind` (src/main.rs), which abort turns into a hard abort instead of
# a mapped exit code.

# cargo never reclaims `target/*/incremental`, and it ends up dwarfing the working set it
# accelerates. Off here; the cost is a few seconds per crate when recompiling.
[profile.dev]
incremental = false
# Debug info is the largest lever on dev-build disk here. Measured on this crate
# (10-core M1 Pro, cold, fresh target dir):
#   own crate debug=2, deps debug=2    8.27 s   372 M
#   own crate debug=2, deps debug=0    7.34 s   225 M   <- chosen
#   everything debug=0                 7.57 s   225 M
#   everything "line-tables-only"      7.17 s   309 M
# Wall-clock spread here is run-to-run noise (~5%); the disk spread is not. Dependencies are
# where both the bytes and the codegen time live, so scoping the switch to `package."*"`
# keeps file:line and locals for *this* crate at no extra cost.
[profile.dev.package."*"]
debug = 0
strip = "none"
